# Сборка и публикация обновления WatchTogether.
#
# Запускается, когда в репозиторий пушится тег версии (v0.9.3 и т.п.):
#   npm run set-version -- 0.9.3
#   git commit -am "v0.9.3" && git tag v0.9.3
#   git push && git push origin v0.9.3
#
# GitHub собирает установщик на своей Windows-машине и публикует релиз
# (exe + latest.yml + blockmap). Установленные приложения находят его сами
# (при запуске и раз в 4 часа), скачивают в фоне и ставят тихо по кнопке
# «Обновить и перезапустить».
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # создать релиз и загрузить в него файлы

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужна история, чтобы проверить, что тег стоит на main

      - name: Тег должен указывать на коммит из main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Тег ${GITHUB_REF_NAME} не на ветке main. Сначала слейте изменения в main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Версия в файлах совпадает с тегом
        run: node scripts/set-version.mjs --check ${{ github.ref_name }}

      - name: Зависимости
        shell: bash
        run: |
          npm ci --prefix app --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund
          npm ci --prefix desktop --no-audit --no-fund

      - name: Сборка и публикация установщика
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build.mjs --installer

      - name: Файлы релиза (на случай, если нужно скачать вручную)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: ignore
          retention-days: 14
